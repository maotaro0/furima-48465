default: &default
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  adapter: mysql2
  username: root
  password:
  host: localhost
  database: furima48465_development

test:
  <<: *default
  adapter: mysql2
  username: root
  password:
  host: localhost
  database: furima48465_test

production:
  adapter: mysql2
  encoding: utf8mb4
  database: furima__production
  username: root
  password: <%= ENV['DATABASE_PASSWORD'] %>
  socket: /var/lib/mysql/mysql.sock